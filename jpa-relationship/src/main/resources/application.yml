spring:
  application:
    name: jpa-relationship
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:13311/jpa_relationship
    username: root
    password: root
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        session_factory.statement_inspector: com.next.relationship.config.QueryCountInspector
    hibernate:
      ddl-auto: create